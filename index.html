<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 King Clicker Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-gold: #FFD700;
            --primary-gold-dark: #DAA520;
            --bg-gradient: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 50%, #3a3a5e 100%);
            --card-glow: 0 0 30px rgba(255, 215, 0, 0.4);
            --shadow-neon: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-gradient);
            color: #fff;
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
        }
        button, .crown, .status-card {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            border: none;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(255,215,0,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(120,219,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .tabs { 
            display: flex; 
            height: 64px; 
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
        }
        .tab { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer; 
            padding: 0 20px; 
            transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .tab::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        .tab:hover::before { left: 100%; }
        .tab.active { 
            background: linear-gradient(145deg, var(--primary-gold), var(--primary-gold-dark));
            box-shadow: var(--card-glow);
            color: #000;
            text-shadow: none;
        }
        .content { height: calc(100vh - 64px); overflow: hidden; position: relative; z-index: 5; }
        .clicker-tab { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px; 
            text-align: center; 
            height: 100%;
        }
        .shop-tab { padding: 30px 20px; height: 100%; overflow-y: auto; }
        .status { 
            font-size: 32px; 
            font-weight: 900; 
            margin-bottom: 16px; 
            min-height: 40px;
            background: linear-gradient(45deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .score { 
            font-size: 72px; 
            font-weight: 900; 
            text-shadow: 0 0 40px rgba(255,215,0,0.8);
            margin-bottom: 12px;
            background: linear-gradient(45deg, #FFD700, #FFEB3B, #FFF176);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: scoreGlow 2s ease-in-out infinite alternate;
        }
        @keyframes scoreGlow {
            0% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
            100% { filter: drop-shadow(0 0 40px rgba(255,215,0,0.9)); }

        .total-score { 
            font-size: 20px;

        }
        .crown { 
            font-size: 200px; 
            cursor: pointer; 
            transition: all 0.12s cubic-bezier(0.25,0.46,0.45,0.94); 
            display: block; 
            margin-bottom: 50px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));

            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

        }
        .crown:active { 
            transform: scale(0.88) rotate(5deg); 
            filter: drop-shadow(0 10px 20px rgba(255,215,0,0.8));
        }
        .crown.clicked { 
            animation: crownPulse 0.25s cubic-bezier(0.25,0.46,0.45,0.94); 
            transform: scale(1.05);
        }
        @keyframes crownPulse { 
            0%,100%{transform:scale(1) rotate(0deg);} 
            30%{transform:scale(1.15) rotate(-8deg);} 
            60%{transform:scale(0.9) rotate(4deg);}
        }
        .particles {

        }
        .particle {
            position: absolute;

            animation: particleFloat 1s ease-out forwards;
        }
        @keyframes particleFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.5) rotate(360deg); }
        }
        .buttons { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            width: 100%; 
            max-width: 360px; 
        }
        .btn { 
            background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));

            color: #fff; 
            border: 2px solid rgba(255,255,255,0.3);

            padding: 20px 28px; 
            font-size: 20px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: var(--shadow-neon);
            transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            height: 68px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;

            transition: left 0.6s;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border-color: var(--primary-gold);
        }
        .btn:active { 
            transform: translateY(-1px) scale(0.98); 
        }
        .btn:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
            transform: none; 
            filter: grayscale(1);
        }
        .random-btn { 
            background: linear-gradient(145deg, rgba(255,107,107,0.3), rgba(238,90,82,0.2));
            border-color: rgba(255,107,107,0.5);
        }
        .donate-btn { 
            background: linear-gradient(145deg, rgba(255,217,61,0.4), rgba(255,193,7,0.3));
            color: #000;
            border-color: rgba(255,217,61,0.6);
            font-weight: 800;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .shop-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }
        .status-card { 
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px; 
            padding: 24px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .status-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-card:hover::before { opacity: 1; }
        .status-card:hover { 
            transform: translateY(-8px) scale(1.05); 
            box-shadow: var(--card-glow), var(--shadow-neon);
            border-color: var(--primary-gold);
        }
        .status-card.active { 
            border-color: var(--primary-gold); 
            background: linear-gradient(145deg, rgba(255,215,0,0.2), rgba(255,215,0,0.1));
            box-shadow: var(--card-glow);
            animation: activePulse 2s ease-in-out infinite;
        }
        @keyframes activePulse {
            0%,100% { box-shadow: var(--card-glow); }
            50% { box-shadow: 0 0 50px rgba(255,215,0,0.8); }
        }
        .status-emoji { 
            font-size: 48px; 
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }
        .status-name { 
            font-size: 20px; 
            font-weight: 800; 
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .status-price { 
            font-size: 18px; 
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .status-price.locked { 
            color: #ff6b6b;

        }
        .progress-bar {
            width: 100%; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 3px; margin-top: 12px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary-gold), var(--primary-gold-dark));
            width: 0%; transition: width 0.5s ease; border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,215,0,0.6);
        }
        .prestige-btn {
            background: linear-gradient(145deg, rgba(128,0,128,0.4), rgba(75,0,130,0.3));
            border-color: rgba(255,20,147,0.6);
            margin-top: 20px;
        }
        @media (max-width: 480px) { 
            .score { font-size: 56px; } 
            .crown { font-size: 160px; } 
            .status { font-size: 26px; } 
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } 
        }
        .achievement-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(145deg, var(--primary-gold), var(--primary-gold-dark));
            color: #000;
            padding: 30px 40px;
            border-radius: 24px;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 30px 100px rgba(0,0,0,0.8);
            z-index: 1000;
            text-align: center;
            animation: achievementPop 0.6s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
        }
        @keyframes achievementPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" data-tab="clicker">👑 Кликер</div>
        <div class="tab" data-tab="shop">🛒 Статусы</div>
        <div class="tab" data-tab="prestige">⭐ Престиж</div>
    </div>
    <div class="content">
        <div id="clicker-tab" class="tab-content active">
            <div class="clicker-tab">
                <div class="status" id="status">Крестьянин</div>
                <div class="score" id="score">0</div>
                <div class="total-score" id="totalScore">Всего кликов: 0</div>
                <div class="crown" id="crown" touch-action="manipulation">👑</div>
                <div class="buttons">
                    <button class="btn random-btn" id="randomBtn">🎲 Рандом статус</button>
                    <button class="btn donate-btn" id="donateBtn">⭐ Звезды (<span id="starsCount">0</span> ⭐)</button>
                    <button class="btn prestige-btn" id="prestigeBtn" style="display:none;">💎 Престиж (x2)</button>
                </div>
            </div>
        </div>
        <div id="shop-tab" class="tab-content">
            <div class="shop-tab">
                <h2 style="font-size:28px;margin-bottom:30px;text-align:center;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,0.5);">Выбери свой статус</h2>
                <div class="shop-grid" id="statusGrid"></div>
            </div>
        </div>
        <div id="prestige-tab" class="tab-content">
            <div class="shop-tab" style="text-align:center;">
                <h2 style="font-size:28px;margin-bottom:40px;font-weight:900;">🌌 Престиж система</h2>
                <div style="background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:24px;padding:40px;margin:20px;border:2px solid rgba(255,255,255,0.2);">
                    <div style="font-size:22px;margin-bottom:20px;">Уровень престижа: <span id="prestigeLevel">0</span></div>
                    <div style="font-size:20px;margin-bottom:30px;color:rgba(255,215,0,1);">Множитель: <span id="prestigeMultiplier">1x</span></div>
                    <div style="font-size:18px;margin-bottom:20px;">До следующего уровня: <span id="prestigeProgress">0</span> / 1,000,000 кликов</div>
                    <div class="progress-bar"><div class="progress-fill" id="prestigeProgressBar"></div></div>
                    <button class="btn" style="margin-top:30px;font-size:22px;padding:24px 40px;" id="claimPrestige">🚀 Получить престиж!</button>
                </div>
            </div>
        </div>
    </div>
    <div class="particles" id="particles"></div>

    <script>
        class KingClickerElite {
            constructor() {
                this.score = 0;
                this.totalClicks = 0;
                this.status = 'Крестьянин';
                this.stars = 0;
                this.prestigeLevel = 0;
                this.prestigeMultiplier = 1;
                this.statuses = [
                    {name:'Крестьянин', emoji:'🌾', price:0, multiplier:1},
                    {name:'⚔️ Воин', emoji:'⚔️', price:250, multiplier:2},
                    {name:'🛡️ Рыцарь', emoji:'🛡️', price:600, multiplier:4},
                    {name:'👑 Король', emoji:'👑', price:1500, multiplier:8},
                    {name:'💎 Алмаз', emoji:'💎', price:3500, multiplier:16},
                    {name:'🔥 Легенда', emoji:'🔥', price:8000, multiplier:32},
                    {name:'🌟 Миф', emoji:'🌟', price:18000, multiplier:64},
                    {name:'⚡ Бог', emoji:'⚡', price:40000, multiplier:128},
                    {name:'🌀 Вихрь', emoji:'🌀', price:90000, multiplier:256},
                    {name:'🌌 Космос', emoji:'🌌', price:200000, multiplier:512},
                    {name:'⭐ Император', emoji:'⭐', price:500000, multiplier:1024},
                    {name:'💀 Король Мира', emoji:'💀', price:1500000, multiplier:2048}
                ];
                this.init();
            }

            init() {
                this.tg = window.Telegram?.WebApp;
                if (this.tg) {
                    this.tg.ready();
                    this.tg.expand();
                }

                this.elements = {
                    tabs: document.querySelectorAll('.tab'),
                    tabContents: document.querySelectorAll('.tab-content'),
                    status: document.getElementById('status'),
                    score: document.getElementById('score'),
                    totalScore: document.getElementById('totalScore'),
                    crown: document.getElementById('crown'),
                    randomBtn: document.getElementById('randomBtn'),
                    donateBtn: document.getElementById('donateBtn'),
                    starsCount: document.getElementById('starsCount'),
                    statusGrid: document.getElementById('statusGrid'),
                    prestigeBtn: document.getElementById('prestigeBtn'),
                    prestigeLevel: document.getElementById('prestigeLevel'),
                    prestigeMultiplier: document.getElementById('prestigeMultiplier'),
                    prestigeProgress: document.getElementById('prestigeProgress'),
                    prestigeProgressBar: document.getElementById('prestigeProgressBar'),
                    particles: document.getElementById('particles'),
                    claimPrestige: document.getElementById('claimPrestige')
                };

                this.loadData();
                this.bindEvents();
                this.renderShop();
                this.updateUI();
            }

            bindEvents() {
                // Universal click handler for crown - работает и на PC и на мобильных
                const crown = this.elements.crown;
                const self = this;

                // Mouse events
                crown.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    self.handleCrownClick(e);
                });
                crown.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                });

                // Touch events с мультитачем
                let activeTouches = 0;
                crown.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    activeTouches = e.touches.length;
                    if (activeTouches >= 1) {
                        self.handleCrownClick(e.touches[0]);
                    }
                }, { passive: false });

                crown.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if (activeTouches >= 2) {
                        self.multiClick();
                    }
                    activeTouches = 0;
                }, { passive: false });

                // Остальные кнопки
                this.elements.randomBtn.onclick = () => this.randomStatus();
                this.elements.donateBtn.onclick = () => this.donateStars();
                this.elements.prestigeBtn.onclick = () => this.quickPrestige();
                this.elements.claimPrestige.onclick = () => this.claimPrestige();
                this.elements.tabs.forEach(tab => tab.onclick = (e) => this.switchTab(e));
            }

            handleCrownClick(touchEvent) {
                const multiplier = this.getMultiplier();
                const clickValue = Math.floor(multiplier);
                this.score += clickValue;
                this.totalClicks += 1;
                
                this.elements.crown.classList.add('clicked');
                setTimeout(() => this.elements.crown.classList.remove('clicked'), 250);

                // Particles
                const rect = this.elements.crown.getBoundingClientRect();
                const clientX = touchEvent.clientX || rect.left + rect.width / 2;
                const clientY = touchEvent.clientY || rect.top + rect.height / 2;
                
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => this.createParticle(clientX, clientY), i * 50);
                }

                if (this.tg?.HapticFeedback) {
                    this.tg.HapticFeedback.impactOccurred('heavy');
                }

                this.checkAchievements();
                this.updateUI();
                this.saveData();
            }

            switchTab(e) {
                const tab = e.currentTarget;
                const target = tab.dataset.tab;
                this.elements.tabs.forEach(t => t.classList.remove('active'));
                this.elements.tabContents.forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(target + '-tab').classList.add('active');
            }

            async loadData() {
                const keys = ['score','totalClicks','status','stars','prestigeLevel','prestigeMultiplier'];
                try {
                    if (this.tg?.CloudStorage) {
                        const data = await this.tg.CloudStorage.get(keys);
                        Object.keys(data).forEach(key => {
                            if (data[key]) this[key] = JSON.parse(data[key]);
                        });
                    } else {
                        keys.forEach(key => {
                            const value = localStorage.getItem(`kingclicker_${key}`);
                            if (value) this[key] = JSON.parse(value);
                        });
                    }
                    this.score = parseInt(this.score) || 0;
                    this.totalClicks = parseInt(this.totalClicks) || 0;
                    this.stars = parseInt(this.stars) || 0;
                    this.prestigeLevel = parseInt(this.prestigeLevel) || 0;
                    this.prestigeMultiplier = parseFloat(this.prestigeMultiplier) || 1;
                    this.status = this.status || 'Крестьянин';
                } catch (e) {
                    console.error('Load error:', e);
                }
            }

            async saveData() {
                const data = {
                    score: this.score,
                    totalClicks: this.totalClicks,
                    status: this.status,
                    stars: this.stars,
                    prestigeLevel: this.prestigeLevel,
                    prestigeMultiplier: this.prestigeMultiplier
                };
                
                try {
                    if (this.tg?.CloudStorage) {
                        await this.tg.CloudStorage.set(data);
                    } else {
                        Object.entries(data).forEach(([key, value]) => {
                            localStorage.setItem(`kingclicker_${key}`, JSON.stringify(value));
                        });
                    }
                } catch (e) {
                    console.error('Save error:', e);
                }
            }

            getMultiplier() {
                const status = this.statuses.find(s => s.name === this.status);
                return (status ? status.multiplier : 1) * this.prestigeMultiplier;
            }

            createParticle(x, y, emoji = '⭐') {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = emoji;
                particle.style.left = (x - 12) + 'px';
                particle.style.top = (y - 12) + 'px';
                particle.style.fontSize = '28px';
                this.elements.particles.appendChild(particle);
                setTimeout(() => {
                    if (particle.parentNode) particle.remove();
                }, 1000);
            }

            multiClick() {
                const multiplier = this.getMultiplier();
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        this.score += Math.floor(multiplier * 0.3);
                        this.totalClicks += 1;
                    }, i * 30);
                }
                if (this.tg?.HapticFeedback) this.tg.HapticFeedback.notificationOccurred('success');
                this.updateUI();
                this.saveData();
            }

            checkAchievements() {
                const milestones = [1000, 10000, 100000, 1000000, 10000000];
                for (const milestone of milestones) {
                    if (this.totalClicks >= milestone && !localStorage.getItem(`achieved_${milestone}`)) {
                        localStorage.setItem(`achieved_${milestone}`, 'true');
                        this.showAchievement(`🎉 Достижение: ${milestone.toLocaleString()} кликов!`);
                    }
                }
            }

            showAchievement(message) {
                const popup = document.createElement('div');
                popup.className = 'achievement-popup';
                popup.textContent = message;
                document.body.appendChild(popup);
                if (this.tg?.HapticFeedback) this.tg.HapticFeedback.notificationOccurred('success');
                setTimeout(() => {
                    popup.style.animation = 'none';
                    popup.style.transform = 'translate(-50%, -50%) scale(0)';
                    setTimeout(() => {
                        if (popup.parentNode) document.body.removeChild(popup);
                    }, 300);
                }, 3000);
            }

            randomStatus() {
                const available = this.statuses.filter(s => this.score >= s.price);
                if (available.length > 1) {
                    const random = available[Math.floor(Math.random() * available.length)];
                    this.status = random.name;
                    this.createParticle(window.innerWidth/2, 100, '🎲');
                    if (this.tg?.HapticFeedback) this.tg.HapticFeedback.notificationOccurred('success');
                    this.updateUI();
                    this.saveData();
                }
            }

            donateStars() {
                if (this.stars >= 100) {
                    this.status = '⭐ Звездный Император';
                    this.stars -= 100;
                    this.createParticle(window.innerWidth/2, 150, '⭐');
                    if (this.tg?.HapticFeedback) this.tg.HapticFeedback.notificationOccurred('success');
                    this.updateUI();
                    this.saveData();
                }
            }

            quickPrestige() {
                this.claimPrestige();
            }

            claimPrestige() {
                const requiredClicks = 1000000 * Math.pow(1.5, this.prestigeLevel);
                if (this.totalClicks >= requiredClicks) {
                    this.prestigeLevel++;
                    this.prestigeMultiplier *= 2;
                    this.score = 0;
                    this.totalClicks = 0;
                    this.status = 'Крестьянин';
                    this.showAchievement(`🚀 Престиж ${this.prestigeLevel}! Множитель x${this.prestigeMultiplier}`);
                    if (this.tg?.HapticFeedback) this.tg.HapticFeedback.notificationOccurred('success');
                    this.updateUI();
                    this.saveData();
                }
            }

            renderShop() {
                this.elements.statusGrid.innerHTML = '';
                this.statuses.forEach((status, index) => {
                    const canBuy = this.score >= status.price;
                    const isActive = status.name === this.status;
                    const card = document.createElement('div');
                    card.className = `status-card ${isActive ? 'active' : ''}`;
                    
                    const progress = Math.min((this.score / status.price) * 100, 100);
                    card.innerHTML = `
                        <div class="status-emoji">${status.emoji}</div>
                        <div class="status-name">${status.name}</div>
                        <div class="status-price ${!canBuy ? 'locked' : ''}">
                            ${isActive ? '✅ Активно' : `${status.price.toLocaleString()} 👑`}
                        </div>
                        ${!isActive && status.price > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
                    `;
                    
                    card.onclick = (e) => {
                        e.preventDefault();
                        if (canBuy && !isActive) {
                            this.score -= status.price;
                            this.status = status.name;
                            const rect = card.getBoundingClientRect();
                            this.createParticle(rect.left + rect.width/2, rect.top + 50, status.emoji);
                            if (this.tg?.HapticFeedback) this.tg.HapticFeedback.notificationOccurred('success');
                            this.updateUI();
                            this.saveData();
                        }
                    };
                    this.elements.statusGrid.appendChild(card);
                });
            }

            updateUI() {
                this.elements.score.textContent = Math.floor(this.score).toLocaleString();
                this.elements.status.textContent = this.status;
                this.elements.totalScore.textContent = `Всего кликов: ${this.totalClicks.toLocaleString()}`;
                this.elements.starsCount.textContent = this.stars;
                
                // Prestige UI
                this.elements.prestigeLevel.textContent = this.prestigeLevel;
                this.elements.prestigeMultiplier.textContent = `x${this.prestigeMultiplier.toFixed(0)}`;
                const nextPrestige = 1000000 * Math.pow(1.5, this.prestigeLevel);
                this.elements.prestigeProgress.textContent = `${this.totalClicks.toLocaleString()} / ${Math.floor(nextPrestige).toLocaleString()} кликов`;
                const progress = Math.min((this.totalClicks / nextPrestige) * 100, 100);
                this.elements.prestigeProgressBar.style.width = progress + '%';
                this.elements.prestigeBtn.style.display = this.totalClicks >= nextPrestige ? 'block' : 'none';
                
                this.renderShop();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.Telegram?.WebApp?.ready();
                new KingClickerElite();
            });
        } else {
            window.Telegram?.WebApp?.ready();
            new KingClickerElite();
        }
    </script>
</body>
</html>
