<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 King Clicker Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-gold: #FFD700;
            --primary-gold-dark: #DAA520;
            --bg-gradient: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 50%, #3a3a5e 100%);
            --card-glow: 0 0 30px rgba(255, 215, 0, 0.4);
            --shadow-neon: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-gradient);
            color: #fff;
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
        }
        button, .crown, .status-card {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            border: none;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(255,215,0,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(120,219,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .tabs { 
            display: flex; 
            height: 64px; 
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
        }
        .tab { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer; 
            padding: 0 20px; 
            transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .tab::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        .tab:hover::before { left: 100%; }
        .tab.active { 
            background: linear-gradient(145deg, var(--primary-gold), var(--primary-gold-dark));
            box-shadow: var(--card-glow);
            color: #000;
            text-shadow: none;
        }
        .content { height: calc(100vh - 64px); overflow: hidden; position: relative; z-index: 5; }
        .clicker-tab { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px; 
            text-align: center; 
            height: 100%;
        }
        .shop-tab, .leaderboard-tab, .referral-tab { padding: 30px 20px; height: 100%; overflow-y: auto; }
        .status { 
            font-size: 32px; 
            font-weight: 900; 
            margin-bottom: 16px; 
            min-height: 40px;
            background: linear-gradient(45deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .score { 
            font-size: 72px; 
            font-weight: 900; 
            text-shadow: 0 0 40px rgba(255,215,0,0.8);
            margin-bottom: 12px;
            background: linear-gradient(45deg, #FFD700, #FFEB3B, #FFF176);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: scoreGlow 2s ease-in-out infinite alternate;
        }
        @keyframes scoreGlow {
            0% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
            100% { filter: drop-shadow(0 0 40px rgba(255,215,0,0.9)); }
        }
        .total-score { 
            font-size: 20px; 
            color: rgba(255,255,255,0.8); 
            margin-bottom: 50px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .crown { 
            font-size: 200px; 
            cursor: pointer; 
            transition: all 0.12s cubic-bezier(0.25,0.46,0.45,0.94); 
            display: block; 
            margin-bottom: 50px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
            position: relative;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .crown:active { 
            transform: scale(0.88) rotate(5deg); 
            filter: drop-shadow(0 10px 20px rgba(255,215,0,0.8));
        }
        .crown.clicked { 
            animation: crownPulse 0.25s cubic-bezier(0.25,0.46,0.45,0.94); 
            transform: scale(1.05);
        }
        @keyframes crownPulse { 
            0%,100%{transform:scale(1) rotate(0deg);} 
            30%{transform:scale(1.15) rotate(-8deg);} 
            60%{transform:scale(0.9) rotate(4deg);}
        }
        .particles {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            top: 0; left: 0; width: 100%; height: 100vh;
        }
        .particle {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: particleFloat 1s ease-out forwards;
        }
        @keyframes particleFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.5) rotate(360deg); }
        }
        .buttons { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            width: 100%; 
            max-width: 360px; 
        }
        .btn { 
            background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);
            color: #fff; 
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 24px; 
            padding: 20px 28px; 
            font-size: 20px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: var(--shadow-neon);
            transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            height: 68px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border-color: var(--primary-gold);
        }
        .btn:active { 
            transform: translateY(-1px) scale(0.98); 
        }
        .btn:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
            transform: none; 
            filter: grayscale(1);
        }
        .random-btn { 
            background: linear-gradient(145deg, rgba(255,107,107,0.3), rgba(238,90,82,0.2));
            border-color: rgba(255,107,107,0.5);
        }
        .donate-btn { 
            background: linear-gradient(145deg, rgba(255,217,61,0.4), rgba(255,193,7,0.3));
            color: #000;
            border-color: rgba(255,217,61,0.6);
            font-weight: 800;
        }
        .prestige-btn {
            background: linear-gradient(145deg, rgba(128,0,128,0.4), rgba(75,0,130,0.3));
            border-color: rgba(255,20,147,0.6);
        }
        .leaderboard-grid, .referral-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .leaderboard-item, .referral-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .leaderboard-item:hover, .referral-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-gold);
            box-shadow: var(--card-glow);
        }
        .leaderboard-rank {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-gold);
            margin-bottom: 8px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .shop-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }
        .status-card { 
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px; 
            padding: 24px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .status-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-card:hover::before { opacity: 1; }
        .status-card:hover { 
            transform: translateY(-8px) scale(1.05); 
            box-shadow: var(--card-glow), var(--shadow-neon);
            border-color: var(--primary-gold);
        }
        .status-card.active { 
            border-color: var(--primary-gold); 
            background: linear-gradient(145deg, rgba(255,215,0,0.2), rgba(255,215,0,0.1));
            box-shadow: var(--card-glow);
            animation: activePulse 2s ease-in-out infinite;
        }
        .status-card.purchased { 
            border-color: rgba(46,204,113,0.8); 
            background: rgba(46,204,113,0.1); 
        }
        .status-card.locked { 
            opacity: 0.7; 
            filter: grayscale(0.3);
        }
        @keyframes activePulse {
            0%,100% { box-shadow: var(--card-glow); }
            50% { box-shadow: 0 0 50px rgba(255,215,0,0.8); }
        }
        .status-emoji { 
            font-size: 48px; 
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }
        .status-name { 
            font-size: 20px; 
            font-weight: 800; 
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .status-price { 
            font-size: 18px; 
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .status-price.locked { 
            color: #ff6b6b; 
            filter: drop-shadow(0 0 10px rgba(255,107,107,0.5));
        }
        .status-price.purchased { 
            color: #2ecc71;
        }
        .status-progress { 
            font-size: 12px; 
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }
        .progress-bar {
            width: 100%; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 3px; margin-top: 12px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary-gold), var(--primary-gold-dark));
            width: 0%; transition: width 0.5s ease; border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,215,0,0.6);
        }
        @media (max-width: 480px) { 
            .score { font-size: 56px; } 
            .crown { font-size: 160px; } 
            .status { font-size: 26px; } 
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } 
        }
        .achievement-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(145deg, var(--primary-gold), var(--primary-gold-dark));
            color: #000;
            padding: 30px 40px;
            border-radius: 24px;
