<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-family: sans-serif;
            overflow: hidden;
        }
        #info {
            font-size: 18px;
            margin-bottom: 10px;
            color: #f39c12;
            font-weight: bold;
        }
        #score {
            font-size: 48px;
            margin-bottom: 20px;
        }
        #crown {
            font-size: 150px;
            cursor: pointer;
            transition: transform 0.05s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #crown:active {
            transform: scale(0.95);
        }
        button {
            margin-top: 40px;
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            background: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="info">Статус: <span id="status">...</span></div>
    <div id="score">0</div>
    <div id="crown">👑</div>
    <button onclick="buy()">Стать KING</button>

    <script>
        const tg = window.Telegram.WebApp;
        let score = 0;
        let status = "Крестьянин";

        const scoreDisp = document.getElementById('score');
        const statusDisp = document.getElementById('status');

        function update() {
            scoreDisp.innerText = score;
            statusDisp.innerText = status;
        }

        function load() {
            tg.CloudStorage.getItems(['s', 't'], (err, val) => {
                if (!err) {
                    score = parseInt(val.s) || 0;
                    status = val.t || "Крестьянин";
                }
                update();
            });
        }

        document.getElementById('crown').onclick = () => {
            score++;
            update();
            tg.HapticFeedback.impactOccurred('light');
            if (score % 10 === 0) tg.CloudStorage.setItem('s', score.toString());
        };

        function buy() {
            tg.showConfirm("Купить KING статус?", (ok) => {
                if (ok) {
                    status = "👑 TRUE KING";
                    tg.CloudStorage.setItem('t', status);
                    update();
                    tg.showAlert("Вы теперь Король!");
                }
            });
        }

        tg.ready();
        tg.expand();
        load();
    </script>
</body>
</html>
