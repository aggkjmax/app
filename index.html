<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram King Clicker</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --main-color: #f39c12;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        #status-box {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--main-color);
            padding: 10px;
            border: 2px solid var(--main-color);
            border-radius: 15px;
        }
        #crown {
            font-size: 100px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        #crown:active {
            transform: scale(0.9);
        }
        #score {
            font-size: 2.5rem;
            margin: 10px 0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
        }
        button {
            padding: 15px;
            border-radius: 12px;
            border: none;
            background-color: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
            cursor: pointer;
        }
        .buy-btn {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div id="status-box">Твой статус: <span id="status">Загрузка...</span></div>

    <div id="score">0</div>

    <div id="crown">👑</div>

    <div class="btn-group">
        <button id="invite-btn">Пригласить друга (в список)</button>
        <button id="buy-btn" class="buy-btn">Купить статус "KING" (Stars)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let clicks = 0;
        let userStatus = "Новичок";

        const scoreEl = document.getElementById('score');
        const statusEl = document.getElementById('status');
        const crownEl = document.getElementById('crown');

        // 1. Загрузка данных из CloudStorage Telegram
        tg.CloudStorage.getItems(['clicks', 'status'], (err, values) => {
            if (!err) {
                clicks = parseInt(values.clicks) || 0;
                userStatus = values.status || "Крестьянин";
                updateUI();
            }
        });

        function updateUI() {
            scoreEl.innerText = clicks;
            statusEl.innerText = userStatus;
        }

        // 2. Клик по короне
        crownEl.addEventListener('click', () => {
            clicks++;
            updateUI();
            tg.HapticFeedback.impactOccurred('medium'); // Вибрация
            
            // Сохраняем каждые 5 кликов, чтобы не спамить запросами
            if (clicks % 5 === 0) {
                tg.CloudStorage.setItem('clicks', clicks.toString());
            }
        });

        // 3. Инвайт друзей (через Inline Mode)
        document.getElementById('invite-btn').addEventListener('click', () => {
            tg.switchInlineQuery("Попробуй перекликнуть меня! Я уже " + userStatus, ["users"]);
        });

        // 4. "Покупка" статуса (имитация через Stars)
        document.getElementById('buy-btn').addEventListener('click', () => {
            // В реальном приложении тут вызывается метод оплаты. 
            // Сейчас просто сменим статус для примера.
            tg.showConfirm("Хотите купить статус KING за 50 Stars?", (ok) => {
                if (ok) {
                    userStatus = "👑 TRUE KING";
                    tg.CloudStorage.setItem('status', userStatus);
                    updateUI();
                    tg.showAlert("Поздравляем! Теперь вы Король!");
                }
            });
        });

    </script>
</body>
</html>
